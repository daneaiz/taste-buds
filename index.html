<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>TasteBuds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0f0e0d;
    --bg2:       #1a1917;
    --bg3:       #232220;
    --surface:   #2a2927;
    --line:      rgba(255,255,255,0.08);
    --line2:     rgba(255,255,255,0.14);
    --cream:     #f0ead8;
    --muted:     rgba(240,234,216,0.45);
    --faint:     rgba(240,234,216,0.22);
    --accent:    #e8c97a;
    --accent2:   #c4995a;

    --c-meat:      #e06868;
    --c-asian:     #e8845a;

    --r: 4px;
    --r-lg: 8px;
    --r-pill: 20px;
    --sans: 'DM Sans', sans-serif;
    --serif: 'DM Serif Display', serif;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--cream);
    font-family: var(--sans);
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ── Layout ── */
  #app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    position: relative;
  }

  /* ── Header ── */
  header {
    padding: 0 20px;
    flex-shrink: 0;
    height: 64px;
    display: flex;
    align-items: center;
    border-bottom: 1px solid var(--line);
  }
  .header-inner {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }
  .logo {
    font-family: var(--serif);
    font-size: 20px;
    color: var(--cream);
    letter-spacing: -0.01em;
  }
  .logo em { color: var(--accent); font-style: italic; }
  .tagline {
    font-size: 9px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-top: 1px;
  }

  /* ── Scroll area ── */
  #scroll-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    -webkit-overflow-scrolling: touch;
    padding: 16px 20px 12px;
    scrollbar-width: none;
  }
  #scroll-area::-webkit-scrollbar { display: none; }

  /* ── Screens ── */
  .screen { display: none; animation: fadeIn 0.18s ease; }
  .screen.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ── Section label ── */
  .section-label {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 12px;
  }

  /* ── Category grid ── */
  .cat-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 10px;
    margin-bottom: 28px;
  }
  .cat-card {
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r-lg);
    padding: 16px 18px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .cat-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    border-radius: var(--r-lg) var(--r-lg) 0 0;
    background: var(--cat-color);
    opacity: 0.7;
  }
  .cat-card.active {
    background: var(--bg3);
    border-color: var(--cat-color);
  }
  @media (hover: hover) {
    .cat-card:hover { background: var(--bg3); border-color: var(--line2); }
    .cat-card.active:hover { border-color: var(--cat-color); }
  }
  .cat-name {
    font-family: var(--serif);
    font-size: 22px;
    color: var(--cream);
    line-height: 1.25;
    margin-bottom: 4px;
  }
  .cat-count { font-size: 11px; color: var(--muted); }
  .cat-emoji { font-size: 44px; line-height: 1; flex-shrink: 0; display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; }

  /* ── Sub screen heading ── */
  .sub-heading {
    font-family: var(--serif);
    font-size: 28px;
    font-weight: 400;
    color: var(--cream);
    line-height: 1.25;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
  }
  .sub-heading-cat {
    color: var(--accent);
    font-style: italic;
  }

  /* ── Sub list ── */
  .sub-list { display: flex; flex-direction: column; gap: 2px; margin-bottom: 24px; }
  .sub-item {
    display: flex;
    align-items: center;
    padding: 13px 14px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r);
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
    gap: 10px;
  }
  .sub-item .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--cat-color); flex-shrink: 0;
    opacity: 0.6; transition: opacity 0.12s;
  }
  .sub-item.active .dot { opacity: 1; }
  .sub-item .sub-name { font-size: 15px; color: var(--cream); }
  .sub-name-wrap { flex: 1; display: flex; flex-direction: column; gap: 2px; }
  .sub-example { font-size: 11px; color: var(--muted); }
  .sub-item .sub-n { font-size: 12px; color: var(--muted); }
  .sub-item.active { background: var(--bg3); border-color: var(--line2); }
  .sub-item .chevron { font-size: 14px; color: var(--faint); }
  @media (hover: hover) {
    .sub-item:hover { background: var(--bg3); }
  }

  /* ── Breadcrumb ── */
  .breadcrumb {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 18px;
    flex-wrap: wrap;
  }
  .bc-btn {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 0;
    font-family: var(--sans);
    display: flex; align-items: center; gap: 4px;
  }
  .bc-btn svg { width: 14px; height: 14px; }
  @media (hover: hover) { .bc-btn:hover { color: var(--cream); } }

  /* ── Ingredient checkboxes ── */
  .ing-grid {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 20px;
  }
  .ing-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r);
    cursor: pointer;
    transition: background 0.1s, border-color 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .ing-item.checked {
    background: var(--bg3);
    border-color: var(--cat-color);
  }
  @media (hover: hover) {
    .ing-item:hover { background: var(--bg3); }
  }
  .ing-cb {
    width: 18px; height: 18px; flex-shrink: 0;
    border-radius: 3px;
    border: 1.5px solid var(--line2);
    display: flex; align-items: center; justify-content: center;
    transition: background 0.1s, border-color 0.1s;
    background: transparent;
  }
  .ing-item.checked .ing-cb {
    background: var(--cat-color);
    border-color: var(--cat-color);
  }
  .ing-cb svg { display: none; }
  .ing-item.checked .ing-cb svg { display: block; }
  .ing-name {
    font-size: 15px;
    color: var(--cream);
    flex: 1;
  }
  .ing-item.checked .ing-name { font-weight: 500; }

  /* ── Add bar (sticky at bottom of scroll) ── */
  .add-bar {
    position: sticky;
    bottom: 0;
    background: linear-gradient(to bottom, transparent 0%, var(--bg) 40%);
    padding: 20px 0 8px;
    margin-top: 4px;
  }
  .add-btn {
    width: 100%;
    padding: 15px;
    border-radius: var(--r-lg);
    border: none;
    font-family: var(--serif);
    font-size: 17px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    letter-spacing: 0.01em;
  }
  .add-btn:active { transform: scale(0.98); }
  .add-btn.ready {
    background: var(--accent);
    color: #1a1610;
  }
  .add-btn.empty {
    background: var(--bg3);
    color: var(--faint);
    cursor: default;
  }

  /* ── Select all row ── */
  .select-all-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .select-all-btn, .clear-sel-btn {
    font-size: 12px;
    color: var(--muted);
    background: none;
    border: none;
    cursor: pointer;
    font-family: var(--sans);
    padding: 4px 0;
  }
  @media (hover: hover) {
    .select-all-btn:hover, .clear-sel-btn:hover { color: var(--cream); }
  }

  /* ── Header actions ── */
  .header-inner { align-items: center; width: 100%; }
  #header-left { display: flex; align-items: center; gap: 10px; }
  #header-back {
    background: none; border: none; cursor: pointer;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; padding: 0;
    -webkit-tap-highlight-color: transparent;
  }
  #header-back svg { width: 22px; height: 22px; }
  .header-actions { display: flex; align-items: center; gap: 4px; }
  .header-icon-btn {
    background: none; border: none; cursor: pointer;
    width: 40px; height: 40px;
    display: flex; align-items: center; justify-content: center;
    border-radius: var(--r);
    -webkit-tap-highlight-color: transparent;
    transition: background 0.12s;
    position: relative;
  }
  .header-icon-btn svg { width: 20px; height: 20px; stroke: var(--muted); transition: stroke 0.15s; }
  .header-icon-btn.active svg { stroke: var(--accent); }
  @media (hover: hover) { .header-icon-btn:hover { background: var(--bg2); } }
  .nav-badge {
    position: absolute;
    top: 4px; right: 4px;
    background: var(--accent);
    color: #1a1610;
    font-size: 10px;
    font-weight: 500;
    min-width: 16px;
    height: 16px;
    border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 3px;
  }

  /* ── Shopping list ── */
  .list-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 20px;
  }
  .list-title {
    font-family: var(--serif);
    font-size: 22px;
  }
  .list-actions { display: flex; gap: 8px; }
  .list-action-btn {
    font-size: 12px;
    color: var(--muted);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r);
    padding: 5px 12px;
    cursor: pointer;
    font-family: var(--sans);
    transition: background 0.12s, color 0.12s;
  }
  @media (hover: hover) {
    .list-action-btn:hover { background: var(--bg3); color: var(--cream); }
  }
  .list-action-btn.highlight { border-color: var(--accent); color: var(--accent); }

  .list-group { margin-bottom: 24px; }
  .list-group-label {
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .list-group-dot { width: 5px; height: 5px; border-radius: 50%; }

  .list-items { display: flex; flex-direction: column; gap: 2px; }
  .list-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r);
    animation: slideIn 0.2s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(-8px); } to { opacity: 1; transform: none; } }
  .list-item-name { flex: 1; font-size: 15px; color: var(--cream); }
  .list-item-from { font-size: 11px; color: var(--muted); }
  .list-item-del {
    background: none; border: none; cursor: pointer;
    color: var(--faint); font-size: 18px; line-height: 1;
    padding: 2px 4px; font-family: var(--sans);
    transition: color 0.1s;
  }
  @media (hover: hover) { .list-item-del:hover { color: var(--c-meat); } }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
  }
  .empty-icon {
    font-family: var(--serif);
    font-size: 48px;
    font-style: italic;
    color: var(--faint);
    margin-bottom: 12px;
  }
  .empty-msg { font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ── Search mode tabs ── */
  .mode-btn {
    flex: 1;
    padding: 7px 6px;
    font-size: 11px;
    font-family: var(--sans);
    background: var(--bg2);
    border: 1px solid var(--line);
    border-radius: var(--r);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .mode-btn.active {
    background: var(--bg3);
    border-color: var(--line2);
    color: var(--cream);
  }
  @media (hover: hover) { .mode-btn:hover { background: var(--bg3); color: var(--cream); } }

  /* ── Fridge tags ── */
  .fridge-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12px;
    padding: 4px 10px;
    background: var(--bg3);
    border: 1px solid var(--line2);
    border-radius: var(--r-pill);
    color: var(--cream);
  }
  .fridge-tag button {
    background: none; border: none; cursor: pointer;
    color: var(--muted); font-size: 14px; line-height: 1; padding: 0;
  }

  /* ── Search result cards ── */
  .result-group { margin-bottom: 22px; }
  .result-group-label {
    font-size: 10px; font-weight: 500; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--muted); margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px;
  }
  .result-group-dot { width: 5px; height: 5px; border-radius: 50%; flex-shrink: 0; }
  .result-card {
    background: var(--bg2); border: 1px solid var(--line);
    border-radius: var(--r); padding: 12px 14px;
    margin-bottom: 2px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  @media (hover: hover) { .result-card:hover { background: var(--bg3); } }
  .result-card-title { font-size: 14px; font-weight: 500; color: var(--cream); margin-bottom: 4px; }
  .result-card-sub { font-size: 12px; color: var(--muted); }
  .result-card-pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .result-pill {
    font-size: 11px; padding: 2px 8px;
    background: var(--bg3); border: 1px solid var(--line2);
    border-radius: var(--r); color: var(--muted);
  }
  .result-pill.highlight { border-color: var(--accent); color: var(--accent); background: rgba(232,201,122,0.08); }
  .search-empty { text-align: center; padding: 40px 20px; font-size: 14px; color: var(--muted); line-height: 1.6; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: calc(var(--safe-b) + 20px);
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--cream);
    color: var(--bg);
    font-size: 13px;
    font-weight: 500;
    padding: 9px 18px;
    border-radius: var(--r-pill);
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 100;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div id="app">
  <header>
    <div class="header-inner">
      <div id="header-left">
        <button id="header-back" onclick="exploreOrBack()" style="display:none;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" stroke="var(--cream)">
            <path d="M19 12H5M12 5l-7 7 7 7"/>
          </svg>
        </button>
        <div id="header-logo">
          <div class="logo">Taste<em>Buds</em></div>
          <div class="tagline">Complementary flavours</div>
        </div>
      </div>
      <div class="header-actions">
        <button class="header-icon-btn" id="btn-explore" onclick="switchTab('explore')" aria-label="Explore">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
          </svg>
        </button>
        <button class="header-icon-btn" id="btn-search" onclick="switchTab('search')" aria-label="Search">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
        <button class="header-icon-btn" id="btn-list" onclick="switchTab('list')" aria-label="My List" style="position:relative;">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
            <rect x="9" y="3" width="6" height="4" rx="1"/>
            <line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/>
          </svg>
          <div class="nav-badge" id="list-badge" style="display:none;"></div>
        </button>
      </div>
    </div>
  </header>

  <div id="scroll-area">
    <!-- Screen: Categories -->
    <div id="screen-cats" class="screen active">
      <p class="section-label" style="margin-top:16px;">Choose a category</p>
      <div class="cat-grid" id="cat-grid"></div>
    </div>

    <!-- Screen: Subcategories -->
    <div id="screen-subs" class="screen">
<h1 class="sub-heading">Which <em id="sub-bc-label" class="sub-heading-cat"></em> will you be cooking?</h1>
      <p class="section-label">Select an ingredient</p>
      <div class="sub-list" id="sub-list"></div>
    </div>

    <!-- Screen: Ingredient pairings -->
    <div id="screen-ings" class="screen">
<h1 class="sub-heading" style="margin-bottom:8px;">Ingredients that go well with <em id="ing-heading-sub" class="sub-heading-cat"></em></h1>
      <p id="ing-description" style="font-size:13px; color:var(--muted); line-height:1.6; margin-bottom:20px;"></p>
      <div class="select-all-row">
        <button class="select-all-btn" onclick="selectAll()">Select all</button>
        <button class="clear-sel-btn" onclick="clearSel()">Clear</button>
      </div>
      <div class="ing-grid" id="ing-grid"></div>
      <div class="add-bar">
        <button class="add-btn empty" id="add-btn" onclick="addToList()">Add to list</button>
      </div>
    </div>
  </div>

  <!-- Screen: Search (full, not in scroll area) -->
  <div id="screen-search" style="display:none; flex:1; overflow:hidden; flex-direction:column;">
    <div style="flex:1; overflow-y:auto; padding:16px 20px 12px; scrollbar-width:none;">
      <div id="search-header" style="margin-bottom:16px;">
        <h1 class="sub-heading" style="margin-bottom:12px;">Search <em class="sub-heading-cat">& Discover</em></h1>
        <!-- Mode tabs -->
        <div id="search-modes" style="display:flex; gap:6px; margin-bottom:14px;">
          <button class="mode-btn active" id="mode-search" onclick="setSearchMode('search')">🔍 Find pairings</button>
          <button class="mode-btn" id="mode-reverse" onclick="setSearchMode('reverse')">🔄 Reverse lookup</button>
          <button class="mode-btn" id="mode-fridge" onclick="setSearchMode('fridge')">🧊 What's in my fridge?</button>
        </div>
        <!-- Search input -->
        <div id="search-input-wrap" style="position:relative;">
          <input id="search-input" type="text" placeholder="Type an ingredient…" autocomplete="off" autocorrect="off" spellcheck="false"
            style="width:100%; padding:12px 14px 12px 38px; background:var(--bg2); border:1px solid var(--line2); border-radius:var(--r); color:var(--cream); font-family:var(--sans); font-size:16px; outline:none;"
            oninput="onSearchInput()" />
          <svg style="position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;" viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
          <button id="search-clear" onclick="clearSearch()" style="display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;line-height:1;">×</button>
        </div>
        <!-- Fridge selected tags -->
        <div id="fridge-tags" style="display:none; flex-wrap:wrap; gap:6px; margin-top:10px;"></div>
      </div>
      <div id="search-results"></div>
    </div>
  </div>

  <!-- Screen: Shopping list (full, not in scroll area) -->
  <div id="screen-list" style="display:none; flex:1; overflow:hidden; flex-direction:column;">
    <div id="list-scroll" style="flex:1; overflow-y:auto; padding:16px 20px 12px; scrollbar-width:none;">
      <div class="list-header">
        <div class="list-title">My List</div>
        <div class="list-actions">
          <button class="list-action-btn highlight" id="copy-btn" onclick="copyList()">Copy</button>
        </div>
      </div>
      <div id="list-body"></div>

// ── Render subcategories ──
function renderSubs() {
  const list = document.getElementById('sub-list');
  list.innerHTML = '';
  document.getElementById('sub-bc-label').textContent = selCat;
  Object.entries(DATA[selCat].items).forEach(([sub, ings]) => {
    const el = document.createElement('div');
    el.className = 'sub-item' + (selSub === sub ? ' active' : '');
    el.style.setProperty('--cat-color', selColor);
    const example = SUB_EXAMPLES[sub] ? `<div class="sub-example">${SUB_EXAMPLES[sub]}</div>` : '';
    el.innerHTML = `<div class="dot"></div><div class="sub-name-wrap"><div class="sub-name">${sub}</div>${example}</div><div class="sub-n">${ings.length}</div><div class="chevron">›</div>`;
    el.onclick = () => { selSub = sub; checked.clear(); showScreen('ings'); };
    list.appendChild(el);
  });
}

// ── Render ingredient checkboxes ──
function renderIngs() {
  const grid = document.getElementById('ing-grid');
  grid.innerHTML = '';
  document.getElementById('ing-heading-sub').textContent = selSub;
  const descEl = document.getElementById('ing-description');
  descEl.textContent = SUB_DESCRIPTIONS[selSub] || '';
  descEl.style.display = SUB_DESCRIPTIONS[selSub] ? 'block' : 'none';

  const ings = DATA[selCat].items[selSub];
  ings.forEach(name => {
    const on = checked.has(name);
    const el = document.createElement('div');
    el.className = 'ing-item' + (on ? ' checked' : '');
    el.style.setProperty('--cat-color', selColor);
    el.innerHTML = `
      <div class="ing-cb">
        <svg width="10" height="8" viewBox="0 0 10 8" fill="none" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4l3 3 5-6"/>
        </svg>
      </div>
      <div class="ing-name">${name}</div>`;
    el.onclick = () => {
      if (checked.has(name)) checked.delete(name); else checked.add(name);
      renderIngs();
    };
    grid.appendChild(el);
  });
  updateAddBtn();
}

function updateAddBtn() {
  const btn = document.getElementById('add-btn');
  const n = checked.size;
  if (n > 0) {
    btn.className = 'add-btn ready';
    btn.textContent = `Add ${n} ingredient${n > 1 ? 's' : ''} to list`;
  } else {
    btn.className = 'add-btn empty';
    btn.textContent = 'Select ingredients to add';
  }
}

function selectAll() {
  DATA[selCat].items[selSub].forEach(i => checked.add(i));
  renderIngs();
}
function clearSel() {
  checked.clear();
  renderIngs();
}

function addToList() {
  if (!checked.size) return;
  let added = 0;
  const existing = new Set(shopList.map(x => x.name));
  checked.forEach(name => {
    if (!existing.has(name)) {
      shopList.push({ name, cat: selCat, sub: selSub, color: selColor });
      added++;
    }
  });
  checked.clear();
  updateAddBtn();
  renderIngs();
  updateBadge();
  showToast(added > 0 ? `${added} added to list` : 'Already in your list');
}

// ── Shopping list ──
function renderList() {
  const body = document.getElementById('list-body');
  const clearWrap = document.getElementById('list-clear-wrap');
  if (shopList.length === 0) {
    body.innerHTML = `<div class="empty-state"><div class="empty-icon">∅</div><div class="empty-msg">Your list is empty.<br>Explore ingredients and add them here.</div></div>`;
    clearWrap.style.display = 'none';
    return;
  }
  clearWrap.style.display = 'block';
  // Group by category
  const groups = {};
  shopList.forEach(item => {
    if (!groups[item.cat]) groups[item.cat] = [];
    groups[item.cat].push(item);
  });
  body.innerHTML = '';
  Object.entries(groups).forEach(([cat, items]) => {
    const g = document.createElement('div');
    g.className = 'list-group';
    g.innerHTML = `<div class="list-group-label"><div class="list-group-dot" style="background:${items[0].color};"></div>${cat}</div><div class="list-items" id="grp-${cat.replace(/\s/g,'_')}"></div>`;
    body.appendChild(g);
    const grpEl = document.getElementById(`grp-${cat.replace(/\s/g,'_')}`);
    items.forEach(item => {
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `<div class="list-item-name">${item.name}</div><div class="list-item-from">${item.sub}</div><button class="list-item-del" onclick="removeItem('${item.name.replace(/'/g,"\\'")}')">×</button>`;
      grpEl.appendChild(row);
    });
  });
}

function removeItem(name) {
  shopList = shopList.filter(i => i.name !== name);
  renderList();
  updateBadge();
}

let clearPending = false;
let clearTimer = null;

function confirmClear() {
  const btn = document.getElementById('clear-all-btn');
  if (!clearPending) {
    clearPending = true;
    btn.textContent = 'Tap again to confirm';
    btn.style.color = 'var(--c-meat)';
    clearTimer = setTimeout(function() {
      clearPending = false;
      btn.textContent = 'Clear all items';
      btn.style.color = 'var(--muted)';
    }, 3000);
  } else {
    clearTimeout(clearTimer);
    clearPending = false;
    btn.textContent = 'Clear all items';
    btn.style.color = 'var(--muted)';
    clearList();
  }
}

function clearList() {
  shopList = [];
  renderList();
  updateBadge();
}

function copyList() {
  const text = shopList.map(i => `• ${i.name}`).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    showToast('Copied to clipboard');
    const btn = document.getElementById('copy-btn');
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 2000);
  });
}

function updateBadge() {
  var badge = document.getElementById('list-badge');
  if (shopList.length > 0) {
    badge.style.display = 'flex';
    badge.textContent = shopList.length;
  } else {
    badge.style.display = 'none';
  }
}

// ── Screen navigation ──
function showScreen(name) {
  currentScreen = name;
  // Always show scroll-area, hide list panel
  document.getElementById('scroll-area').style.display = 'flex';
  document.getElementById('scroll-area').style.flexDirection = 'column';
  document.getElementById('screen-list').style.display = 'none';
  document.getElementById('screen-search').style.display = 'none';
  ['cats','subs','ings'].forEach(s => {
    document.getElementById(`screen-${s}`).classList.toggle('active', s === name);
  });
  document.getElementById('scroll-area').scrollTop = 0;
  if (name === 'cats') renderCats();
  if (name === 'subs') renderSubs();
  if (name === 'ings') renderIngs();
  updateExploreBtn();
}



function updateExploreBtn() {
  var isDeep = currentTab === 'explore' && (currentScreen === 'subs' || currentScreen === 'ings');
  document.getElementById('header-back').style.display = isDeep ? 'flex' : 'none';
  document.getElementById('header-logo').style.display = isDeep ? 'none' : 'block';
}

function exploreOrBack() {
  if (currentScreen === 'ings') { showScreen('subs'); }
  else if (currentScreen === 'subs') { showScreen('cats'); }
  else { switchTab('explore'); }
}



// ══════════════════════════════════════════════════════
// ── SEARCH FEATURE ────────────────────────────────────
// ══════════════════════════════════════════════════════

let searchMode = 'search';
let fridgeItems = new Set();

// Build flat indexes once
const ALL_SUBS = [];
const ALL_FLAVOURS = {};

Object.entries(DATA).forEach(function(catEntry) {
  var cat = catEntry[0], d = catEntry[1];
  Object.entries(d.items).forEach(function(subEntry) {
    var sub = subEntry[0], ings = subEntry[1];
    ALL_SUBS.push({ cat: cat, sub: sub, color: d.color, ings: ings });
    ings.forEach(function(f) {
      var key = f.toLowerCase();
      if (!ALL_FLAVOURS[key]) ALL_FLAVOURS[key] = { display: f, pairs: [] };
      ALL_FLAVOURS[key].pairs.push({ cat: cat, sub: sub, color: d.color, ings: ings });
    });
  });
});

const ALL_FLAVOUR_KEYS = Object.keys(ALL_FLAVOURS).sort();

function setSearchMode(mode) {
  searchMode = mode;
  ['search','reverse','fridge'].forEach(function(m) {
    document.getElementById('mode-' + m).classList.toggle('active', m === mode);
  });
  var input = document.getElementById('search-input');
  var fridgeTags = document.getElementById('fridge-tags');
  if (mode === 'search') {
    input.placeholder = 'Type an ingredient to see its pairings…';
    fridgeTags.style.display = 'none';
  } else if (mode === 'reverse') {
    input.placeholder = 'Type a flavour (e.g. lemon, garlic)…';
    fridgeTags.style.display = 'none';
  } else {
    input.placeholder = 'Add ingredients you have…';
    fridgeTags.style.display = fridgeItems.size ? 'flex' : 'none';
  }
  input.value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderSearchResults();
}

function onSearchInput() {
  var val = document.getElementById('search-input').value.trim();
  document.getElementById('search-clear').style.display = val ? 'block' : 'none';
  if (searchMode === 'fridge') {
    renderFridgeSuggestions(val);
  } else {
    renderSearchResults();
  }
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderSearchResults();
}

function renderSearchResults() {
  var el = document.getElementById('search-results');
  var q = document.getElementById('search-input').value.trim().toLowerCase();

  if (searchMode === 'fridge') { renderFridgeResults(); return; }

  if (!q) {
    el.innerHTML = '<p class="search-empty">Start typing to search.</p>';
    return;
  }

  if (searchMode === 'search') {
    var seen = new Set();
    var matches = [];

    // 1. Direct sub name match (case-insensitive, partial)
    ALL_SUBS.forEach(function(s) {
      var key = s.cat + '|' + s.sub;
      if (s.sub.toLowerCase().includes(q) && !seen.has(key)) {
        seen.add(key); matches.push(s);
      }
    });

    // 2. Alias match — any alias key that partially matches the query
    Object.keys(SUB_ALIASES).forEach(function(alias) {
      if (alias.includes(q)) {
        var subName = SUB_ALIASES[alias];
        ALL_SUBS.forEach(function(s) {
          var key = s.cat + '|' + s.sub;
          if (s.sub === subName && !seen.has(key)) {
            seen.add(key); matches.push(s);
          }
        });
      }
    });
    if (!matches.length) {
      el.innerHTML = '<p class="search-empty">No ingredients found for "' + q + '".</p>';
      return;
    }
    el.innerHTML = '';
    var groups = {};
    matches.forEach(function(m) {
      if (!groups[m.cat]) groups[m.cat] = { color: m.color, items: [] };
      groups[m.cat].items.push(m);
    });
    Object.entries(groups).forEach(function(entry) {
      var cat = entry[0], g = entry[1];
      var grp = document.createElement('div');
      grp.className = 'result-group';
      var labelDiv = document.createElement('div');
      labelDiv.className = 'result-group-label';
      var dot = document.createElement('div');
      dot.className = 'result-group-dot';
      dot.style.background = g.color;
      labelDiv.appendChild(dot);
      labelDiv.appendChild(document.createTextNode(cat));
      grp.appendChild(labelDiv);
      g.items.forEach(function(m) {
        var card = document.createElement('div');
        card.className = 'result-card';
        card.style.borderLeft = '3px solid ' + m.color;
        var title = document.createElement('div');
        title.className = 'result-card-title';
        title.textContent = m.sub;
        var sub = document.createElement('div');
        sub.className = 'result-card-sub';
        sub.textContent = m.ings.length + ' complementary flavours';
        var pills = document.createElement('div');
        pills.className = 'result-card-pills';
        m.ings.forEach(function(i) {
          var p = document.createElement('span');
          p.className = 'result-pill';
          p.textContent = i;
          pills.appendChild(p);
        });
        card.appendChild(title);
        card.appendChild(sub);
        card.appendChild(pills);
        card.onclick = (function(m) { return function() {
          selCat = m.cat; selColor = m.color; selSub = m.sub; checked = new Set();
          goToIng();
        }; })(m);
        grp.appendChild(card);
      });
      el.appendChild(grp);
    });

  } else if (searchMode === 'reverse') {
    var matchKeys = ALL_FLAVOUR_KEYS.filter(function(k) { return k.includes(q); });
    if (!matchKeys.length) {
      el.innerHTML = '<p class="search-empty">No flavour found for "' + q + '".</p>';
      return;
    }
    el.innerHTML = '';
    matchKeys.slice(0, 12).forEach(function(key) {
      var entry = ALL_FLAVOURS[key];
      var grp = document.createElement('div');
      grp.className = 'result-group';
      var labelDiv = document.createElement('div');
      labelDiv.style.cssText = 'font-size:13px;font-weight:500;color:var(--cream);margin-bottom:6px;';
      labelDiv.textContent = entry.display;
      grp.appendChild(labelDiv);
      entry.pairs.forEach(function(p) {
        var card = document.createElement('div');
        card.className = 'result-card';
        card.style.borderLeft = '3px solid ' + p.color;
        var title = document.createElement('div');
        title.className = 'result-card-title';
        title.textContent = p.sub;
        var catLabel = document.createElement('div');
        catLabel.className = 'result-card-sub';
        catLabel.textContent = p.cat;
        card.appendChild(title);
        card.appendChild(catLabel);
        card.onclick = (function(p) { return function() {
          selCat = p.cat; selColor = p.color; selSub = p.sub; checked = new Set();
          goToIng();
        }; })(p);
        grp.appendChild(card);
      });
      el.appendChild(grp);
    });
  }
}

// ── Fridge mode ──
function renderFridgeSuggestions(q) {
  var el = document.getElementById('search-results');
  if (!q) { renderFridgeResults(); return; }
  var subMatches = ALL_SUBS
    .filter(function(s) { return s.sub.toLowerCase().includes(q) && !fridgeItems.has(s.sub); })
    .map(function(s) { return { label: s.sub, type: 'ingredient' }; });
  var flavourMatches = ALL_FLAVOUR_KEYS
    .filter(function(k) { return k.includes(q) && !fridgeItems.has(ALL_FLAVOURS[k].display); })
    .slice(0, 6)
    .map(function(k) { return { label: ALL_FLAVOURS[k].display, type: 'flavour' }; });
  var combined = subMatches.concat(flavourMatches).slice(0, 10);
  if (!combined.length) { el.innerHTML = ''; return; }
  el.innerHTML = '';
  var header = document.createElement('div');
  header.className = 'result-group-label';
  header.style.marginBottom = '6px';
  header.textContent = 'Suggestions';
  el.appendChild(header);
  combined.forEach(function(item) {
    var row = document.createElement('div');
    row.className = 'result-card';
    row.style.cssText = 'display:flex;align-items:center;justify-content:space-between;';
    var name = document.createElement('span');
    name.style.cssText = 'font-size:14px;color:var(--cream);';
    name.textContent = item.label;
    var type = document.createElement('span');
    type.style.cssText = 'font-size:11px;color:var(--muted);';
    type.textContent = item.type;
    row.appendChild(name);
    row.appendChild(type);
    row.onclick = (function(item) { return function() { addToFridge(item.label); }; })(item);
    el.appendChild(row);
  });
}

function addToFridge(name) {
  fridgeItems.add(name);
  document.getElementById('search-input').value = '';
  document.getElementById('search-clear').style.display = 'none';
  renderFridgeTags();
  renderFridgeResults();
}

function removeFromFridge(name) {
  fridgeItems.delete(name);
  renderFridgeTags();
  renderFridgeResults();
}

function renderFridgeTags() {
  var el = document.getElementById('fridge-tags');
  el.style.display = fridgeItems.size ? 'flex' : 'none';
  el.innerHTML = '';
  fridgeItems.forEach(function(name) {
    var tag = document.createElement('span');
    tag.className = 'fridge-tag';
    var text = document.createTextNode(name);
    var btn = document.createElement('button');
    btn.textContent = '×';
    btn.onclick = (function(name) { return function() { removeFromFridge(name); }; })(name);
    tag.appendChild(text);
    tag.appendChild(btn);
    el.appendChild(tag);
  });
}

function renderFridgeResults() {
  var el = document.getElementById('search-results');
  if (!fridgeItems.size) {
    el.innerHTML = '<p class="search-empty">Add ingredients you have and we\'ll suggest what to cook.</p>';
    return;
  }
  var fridgeLower = new Set();
  fridgeItems.forEach(function(f) { fridgeLower.add(f.toLowerCase()); });
  var scored = ALL_SUBS.map(function(s) {
    var matches = s.ings.filter(function(i) { return fridgeLower.has(i.toLowerCase()); });
    return { cat: s.cat, sub: s.sub, color: s.color, ings: s.ings, matches: matches, score: matches.length };
  }).filter(function(s) { return s.score > 0; }).sort(function(a, b) { return b.score - a.score; });
  if (!scored.length) {
    el.innerHTML = '<p class="search-empty">No matches found. Try adding more ingredients.</p>';
    return;
  }
  el.innerHTML = '';
  var header = document.createElement('div');
  header.className = 'result-group-label';
  header.style.marginBottom = '10px';
  header.textContent = 'Best matches for your ingredients';
  el.appendChild(header);
  scored.slice(0, 12).forEach(function(s) {
    var card = document.createElement('div');
    card.className = 'result-card';
    card.style.borderLeft = '3px solid ' + s.color;
    var topRow = document.createElement('div');
    topRow.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;';
    var title = document.createElement('div');
    title.className = 'result-card-title';
    title.textContent = s.sub;
    var score = document.createElement('div');
    score.style.cssText = 'font-size:11px;color:var(--accent);font-weight:500;';
    score.textContent = s.score + (s.score > 1 ? ' matches' : ' match');
    topRow.appendChild(title);
    topRow.appendChild(score);
    var catLabel = document.createElement('div');
    catLabel.className = 'result-card-sub';
    catLabel.textContent = s.cat;
    var pills = document.createElement('div');
    pills.className = 'result-card-pills';
    s.ings.forEach(function(i) {
      var pill = document.createElement('span');
      pill.className = 'result-pill' + (fridgeLower.has(i.toLowerCase()) ? ' highlight' : '');
      pill.textContent = i;
      pills.appendChild(pill);
    });
    card.appendChild(topRow);
    card.appendChild(catLabel);
    card.appendChild(pills);
    card.onclick = (function(s) { return function() {
      selCat = s.cat; selColor = s.color; selSub = s.sub; checked = new Set();
      goToIng();
    }; })(s);
    el.appendChild(card);
  });
}



// ── Aliases: common names -> subcategory ──────────────

  'smoked trout': 'Smoked Fish', 'kipper': 'Smoked Fish',
  // Game
  'venison': 'Game', 'pheasant': 'Game', 'partridge': 'Game',
  'grouse': 'Game', 'quail': 'Game', 'wild boar': 'Game',

  'arugula': 'Rocket', 'courgette': 'Courgette', 'zucchini': 'Courgette',

  'steak': 'Beef', 'ribeye': 'Beef', 'sirloin': 'Beef', 'brisket': 'Beef',

  'sweet corn': 'Carrot', 'parsnip': 'Turnip', 'swede': 'Turnip',

  'iceberg': 'Lettuce', 'baby gem': 'Lettuce',
  'cherry tomato': 'Tomato', 'beef tomato': 'Tomato', 'plum tomato': 'Tomato',

// ── Navigate from search directly to ingredient pairings ──
function goToIng() {
  currentTab = 'explore';
  document.getElementById('btn-explore').classList.add('active');
  document.getElementById('btn-search').classList.remove('active');
  document.getElementById('btn-list').classList.remove('active');
  document.getElementById('screen-search').style.display = 'none';
  document.getElementById('screen-list').style.display = 'none';
  document.getElementById('scroll-area').style.display = 'flex';
  showScreen('ings');
}

// ── Tab switching ──
function switchTab(tab) {
  if (tab === currentTab) return;
  currentTab = tab;
  document.getElementById('btn-explore').classList.toggle('active', tab === 'explore');
  document.getElementById('btn-search').classList.toggle('active', tab === 'search');
  document.getElementById('btn-list').classList.toggle('active', tab === 'list');

  // Hide everything first
  document.getElementById('scroll-area').style.display = 'none';
  document.getElementById('screen-search').style.display = 'none';
  document.getElementById('screen-list').style.display = 'none';

  if (tab === 'list') {
    document.getElementById('screen-list').style.display = 'flex';
    renderList();
  } else if (tab === 'search') {
    document.getElementById('screen-search').style.display = 'flex';
    renderSearchResults();
    setTimeout(function() { document.getElementById('search-input').focus(); }, 50);
  } else {
    document.getElementById('scroll-area').style.display = 'flex';
    showScreen(currentScreen);
  }
  updateExploreBtn();
}

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Init ──
renderCats();
document.getElementById('btn-explore').classList.add('active');
updateExploreBtn();
</script>
